name: Verify Staging publication
run-name: Verify Staging publication ${{ github.event.client_payload.verificationId }}
on:
  repository_dispatch:
    types: [verify-publication]
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && ((github.repository == 'PointCommunity/pointsite-staging' && github.event.client_payload.builderOrigin == 'https://builder.eaglepass.io') || (github.repository == 'PointCommunity/pointsite-staging-canary' && github.event.client_payload.builderOrigin == 'https://builder-canary.eaglepass.io'))
    uses: PointCommunity/pointsite-staging/.github/workflows/verify-runtime.yml@33619a5d8413e748f90cb0b8a23b3d1e7a511bf0
    with:
      builder_origin: ${{ github.event.client_payload.builderOrigin }}
      job_id: ${{ github.event.client_payload.verificationId }}
      nonce: ${{ github.event.client_payload.nonce }}
      target: staging
