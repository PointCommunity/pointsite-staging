name: Deploy staging
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Deploy Staging manually from {0}', github.ref_name) || format('Deploy Staging candidate - {0}', github.event.head_commit.message) }}
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pointsite-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify exact candidate before deployment
        run: npm test && npx tsx scripts/verify-staging.mts
      - name: Require the protected staging URL
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          STAGING_CI_URL: ${{ vars.STAGING_CI_URL }}
        run: test -n "$STAGING_URL" && test -n "$STAGING_CI_URL"
      - name: Deploy exact static export to Cloudflare
        run: npx tsx scripts/deploy-staging.mts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
      - name: Verify deployed staging routes and headers
        run: npx tsx scripts/verify-staging.mts
        env:
          STAGING_URL: ${{ vars.STAGING_CI_URL }}
          STAGING_PROBE_SECRET: ${{ secrets.STAGING_PROBE_SECRET }}
          STAGING_VERIFY_RETRY_SECONDS: 5,15,30,60
