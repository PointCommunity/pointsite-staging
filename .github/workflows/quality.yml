name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - name: Verify static-only output
        run: |
          test -f out/index.html
          if rg -i "CF-Access-Jwt-Assertion|GITHUB_APP_PRIVATE_KEY|D1Database|R2Bucket" out; then
            echo "Private runtime material entered the public bundle"
            exit 1
          fi
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pointsite-staging-static
          path: out
          retention-days: 7
