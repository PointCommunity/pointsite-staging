name: Quality
run-name: ${{ github.event_name == 'pull_request' && format('Validate Staging PR {0} - {1}', github.event.pull_request.number, github.event.pull_request.title) || format('Validate Staging candidate - {0}', github.event.head_commit.message) }}
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
