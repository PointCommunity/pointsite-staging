name: Verify retained publication
on:
  workflow_call:
    inputs:
      builder_origin:
        required: true
        type: string
      job_id:
        required: true
        type: string
      nonce:
        required: true
        type: string
      target:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: pointsite-pages-${{ inputs.target }}
  cancel-in-progress: false
env:
  BUILDER_ORIGIN: ${{ inputs.builder_origin }}
  PUBLICATION_JOB_ID: ${{ inputs.job_id }}
  PUBLICATION_NONCE: ${{ inputs.nonce }}
  PUBLICATION_TARGET: ${{ inputs.target }}
  BOOTSTRAP_JS: |
    import { appendFile } from 'node:fs/promises';
    try {
      const job = process.env.PUBLICATION_JOB_ID;
      const nonce = process.env.PUBLICATION_NONCE;
      const operation = process.env.PUBLICATION_OPERATION;
      const builder = process.env.BUILDER_ORIGIN;
      const repository = process.env.PUBLICATION_TARGET === 'production' ? 'pointsite' : builder === 'https://builder-canary.eaglepass.io' ? 'pointsite-staging-canary' : 'pointsite-staging';
      if (process.env.GITHUB_REPOSITORY !== `PointCommunity/${repository}`) throw Error();
      if (!['https://builder.eaglepass.io', 'https://builder-canary.eaglepass.io'].includes(builder) ||
          (process.env.PUBLICATION_TARGET === 'production' && builder !== 'https://builder.eaglepass.io')) throw Error();
      if (!/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/.test(job ?? '') ||
          !/^[a-f0-9]{64}$/.test(nonce ?? '') || !['reserve', 'finalize'].includes(operation) ||
          !['staging', 'production'].includes(process.env.PUBLICATION_TARGET)) throw Error();
      const bounded = async (response, limit) => {
        if (!response.ok || !response.body) throw Error();
        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8', { fatal: true });
        let size = 0, text = '';
        try {
          for (;;) {
            const chunk = await reader.read();
            if (chunk.done) break;
            size += chunk.value.length;
            if (size > limit) throw Error();
            text += decoder.decode(chunk.value, { stream: true });
          }
          return JSON.parse(text + decoder.decode());
        } finally { await reader.cancel(); reader.releaseLock(); }
      };
      const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
      if (url.protocol !== 'https:' || !url.hostname.endsWith('.actions.githubusercontent.com') ||
          url.username || url.password || url.port || !process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN) throw Error();
      url.searchParams.set('audience', `${builder}/verify/${job}/${nonce}`);
      const { value } = await bounded(await fetch(url, {
        headers: { authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
        redirect: 'error', signal: AbortSignal.timeout(10000),
      }), 20000);
      if (typeof value !== 'string' || !value || value.length > 16384) throw Error();
      const source = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString('utf8')).job_workflow_sha;
      if (!/^[a-f0-9]{40}$/.test(source ?? '')) throw Error();
      const result = await bounded(await fetch(`${builder}/api/publish/verification/${job}/${operation}`, {
        method: 'POST', headers: { authorization: `Bearer ${value}` },
        redirect: 'error', signal: AbortSignal.timeout(30000),
      }), 1000);
      if (result[operation === 'reserve' ? 'reserved' : 'verified'] !== true) throw Error();
      await appendFile(process.env.GITHUB_OUTPUT, `source=${source}\n`);
    } catch {
      console.error('Verification identity or state rejected.');
      process.exitCode = 1;
    }
jobs:
  reserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment:
      name: ${{ inputs.target == 'staging' && 'staging' || 'github-pages' }}
      deployment: false
    outputs:
      source: ${{ steps.reserve.outputs.source }}
    steps:
      - id: reserve
        name: Reserve the signed verification run
        env:
          PUBLICATION_OPERATION: reserve
        run: node --input-type=module -e "$BOOTSTRAP_JS"
  execute:
    needs: reserve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ inputs.target == 'staging' && 'staging' || 'github-pages' }}
      deployment: false
    env:
      PUBLICATION_SOURCE: ${{ needs.reserve.outputs.source }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: PointCommunity/pointsite-staging
          ref: ${{ needs.reserve.outputs.source }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the retained manifest and every live output file
        run: node --import tsx scripts/verification-run.mts
      - name: Remove this runner's dependencies
        if: always()
        run: |
          node --input-type=module -e 'import { rm } from "node:fs/promises"; await rm("node_modules", { recursive: true, force: true });'
  finalize:
    needs: [reserve, execute]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment:
      name: ${{ inputs.target == 'staging' && 'staging' || 'github-pages' }}
      deployment: false
    steps:
      - name: Confirm the successful verification check and native deployment
        env:
          PUBLICATION_OPERATION: finalize
        run: node --input-type=module -e "$BOOTSTRAP_JS"
