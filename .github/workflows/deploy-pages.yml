name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages base path
        env:
          CONFIGURED_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
        run: |
          if [[ "$CONFIGURED_BASE_PATH" == "/" ]]; then
            resolved_base_path=""
          elif [[ -n "$CONFIGURED_BASE_PATH" ]]; then
            resolved_base_path="$CONFIGURED_BASE_PATH"
          else
            resolved_base_path="/${GITHUB_REPOSITORY#*/}"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=$resolved_base_path" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Build static website
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
